# 서버·공유 코어·웹(Wasm 브리지 포함)·문서 검사(ADR-0010: 언어마다 빌드 도구가 따로라 경로별로 돌린다).
# 웹 잡은 Linux에서 Wasm을 빌드한다. Windows에서는 Wasm 빌드가 안 돼, 코어 계약이 바뀌어 브리지가 깨지는 것을
# 여기서 처음 잡는다(#57 통합 때 사람이 찾은 문제).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 바뀐 경로로 돌릴 잡을 정한다. 워크플로가 바뀌면 모든 잡이 돈다.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.filter.outputs.server }}
      core: ${{ steps.filter.outputs.core }}
      web: ${{ steps.filter.outputs.web }}
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            all: &all
              - '.github/**'
            server:
              - *all
              - 'server/**'
              - 'db/**'
              - 'api/**'
            core:
              - *all
              - 'core/**'
            web:
              - *all
              - 'core/**'
              - 'web/**'
            ios:
              - *all
              - 'core/**'
              - 'ios/**'
            android:
              - *all
              - 'core/**'
              - 'android/**'
            docs:
              - *all
              - 'docs/**'
              - '**/*.md'
              - 'Scripts/**'

  # Testcontainers가 러너의 Docker로 PGroonga 이미지를 띄운다.
  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: 서버 테스트
        working-directory: server
        run: ./gradlew test

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.4.2
    steps:
      - uses: actions/checkout@v7
      - name: 코어 테스트
        working-directory: core
        run: swift test

  # 브리지(web/Sources)를 Wasm으로 빌드한 뒤 뷰 테스트와 tsc·vite 빌드를 돌린다.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WASM_SDK: swift-6.4.2-RELEASE_wasm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Wasm SDK checksum은 carti-RIBs-Swift CI와 같다(download.swift.org 파일에서 계산한 값).
      - uses: ./.github/actions/setup-swift-linux
        with:
          sdks: wasm-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5
      - name: Wasm 빌드
        working-directory: web
        run: swift package --swift-sdk "$WASM_SDK" js
      - name: 웹 테스트와 빌드
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: 최신 Xcode 선택
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
      - name: Tuist 설치
        run: brew install --cask tuist
      - name: iOS 테스트와 앱 빌드
        working-directory: ios
        run: |
          DEVICE="$(xcrun simctl list devices available iPhone | grep -oE 'iPhone [^()]+' | head -n 1 | xargs)"
          echo "Using simulator: $DEVICE"
          tuist generate --no-open
          tuist test --no-selective-testing --device "$DEVICE"
          tuist generate --no-open
          xcodebuild -workspace Grep.xcworkspace -scheme Grep -destination "platform=iOS Simulator,name=$DEVICE" -configuration Debug build -quiet

  # Android 앱(ADR-0015). Swift 호스트 테스트 뒤 arm64-v8a .so 교차 빌드·Gradle 단위 테스트·디버그 APK 빌드를 돌린다.
  # Android Swift SDK 체크섬과 NDK 연결 절차는 carti-RIBs-Swift CI와 같다.
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: actions/cache@v6
        with:
          path: android/swift/.build
          key: android-swift-${{ hashFiles('android/swift/Package.swift', 'core/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            android-swift-${{ hashFiles('android/swift/Package.swift', 'core/Package.swift') }}-
            android-swift-
      - uses: ./.github/actions/setup-swift-linux
        with:
          sdks: android-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_android.artifactbundle.tar.gz 4d6ad63ea74becd58e123ff58b1b48c3be5ec0db0dff0ea5abe37ac007dd3233
      - name: NDK 설치와 Swift SDK 연결
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          bundle=$(ls -d ~/.swiftpm/swift-sdks/swift-6.4.2-RELEASE_android.artifactbundle \
            ~/.config/swiftpm/swift-sdks/swift-6.4.2-RELEASE_android.artifactbundle 2>/dev/null | head -1)
          [ -n "$bundle" ] || { echo "Android Swift SDK를 찾지 못했습니다"; exit 1; }
          ANDROID_NDK_HOME="$ndk" bash "$bundle/swift-android/scripts/setup-android-sdk.sh"
      - name: Android Swift 호스트 테스트
        working-directory: android/swift
        run: swift test --disable-sandbox
      # PR은 Swift .so를 debug로 교차 빌드한다(release 최적화 빌드가 9분 가까이 걸렸다). main 푸시는 release로 확인한다.
      - name: Android 테스트와 디버그 APK 빌드
        working-directory: android
        env:
          SWIFT_CONFIGURATION: ${{ github.event_name == 'pull_request' && 'debug' || 'release' }}
        run: ./gradlew test assembleDebug -PswiftConfiguration="$SWIFT_CONFIGURATION"

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 문서 검사
        run: bash Scripts/check-docs.sh
