# 서버·공유 코어·웹(Wasm 브리지 포함)·문서 검사(ADR-0010: 언어마다 빌드 도구가 따로라 경로별로 돌린다).
# 웹 잡은 Linux에서 Wasm을 빌드한다. Windows에서는 Wasm 빌드가 안 돼, 코어 계약이 바뀌어 브리지가 깨지는 것을
# 여기서 처음 잡는다(#57 통합 때 사람이 찾은 문제).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 바뀐 경로로 돌릴 잡을 정한다. 워크플로가 바뀌면 모든 잡이 돈다.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.filter.outputs.server }}
      core: ${{ steps.filter.outputs.core }}
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            all: &all
              - '.github/**'
            server:
              - *all
              - 'server/**'
              - 'db/**'
              - 'api/**'
            core:
              - *all
              - 'core/**'
            web:
              - *all
              - 'core/**'
              - 'web/**'
            docs:
              - *all
              - 'docs/**'
              - '**/*.md'
              - 'Scripts/**'

  # Testcontainers가 러너의 Docker로 PGroonga 이미지를 띄운다.
  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: 서버 테스트
        working-directory: server
        run: ./gradlew test

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.4.2
    steps:
      - uses: actions/checkout@v7
      - name: 코어 테스트
        working-directory: core
        run: swift test

  # 브리지(web/Sources)를 Wasm으로 빌드한 뒤 뷰 테스트와 tsc·vite 빌드를 돌린다.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WASM_SDK: swift-6.4.2-RELEASE_wasm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Wasm SDK checksum은 carti-RIBs-Swift CI와 같다(download.swift.org 파일에서 계산한 값).
      - uses: ./.github/actions/setup-swift-linux
        with:
          sdks: wasm-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5
      - name: Wasm 빌드
        working-directory: web
        run: swift package --swift-sdk "$WASM_SDK" js
      - name: 웹 테스트와 빌드
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 문서 검사
        run: bash Scripts/check-docs.sh
