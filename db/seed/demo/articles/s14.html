    <h1>연말 선물 트렌드, 올해는 실속</h1>
    <p>올해 연말 선물은 비싼 한 가지보다 매일 쓰는 작은 물건을 고르는 사람이 많다는 조사가 나왔다.</p>
    <p>원두 드립백 세트, 머그, 작은 디저트 상자처럼 1~2만 원대 선물이 인기다.</p>
    <p>포장을 단출하게 하고 손글씨 카드를 더하는 방식도 늘었다.</p>
