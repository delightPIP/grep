    <h1>겨울 팝업스토어 사례 정리</h1>
    <p>연말을 앞두고 작은 브랜드들이 한두 주짜리 팝업스토어를 여는 일이 많아졌다.</p>
    <p>공간을 꾸미는 비용보다 방문객이 사진을 찍고 싶어지는 한 장면을 만드는 데 힘을 쏟는 곳이 반응이 좋았다.</p>
    <p>팝업을 마친 뒤에도 그 장면을 매장에 옮겨 두어 손님이 다시 찾게 만든 사례도 있다.</p>
