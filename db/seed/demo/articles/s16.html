  <body>
    <p class="note">발표용 가상 기사(팀 작성)</p>
    <h1>다회용컵 보증금, 동네 카페는 어떻게 하나</h1>
    <p>다회용컵 보증금 제도를 두고 작은 카페들의 고민이 크다.</p>
    <p>컵을 돌려받는 곳이 없으면 보증금이 손님에게 부담이 된다.</p>
    <p>몇몇 카페는 텀블러를 가져온 손님에게 보증금을 받지 않는다.</p>
