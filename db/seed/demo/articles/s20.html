    <p>지난 연말 카페 매출은 매장마다 차이가 컸다.</p>
    <p>단골에게 미리 알린 시즌 메뉴와 예약 주문을 받은 곳이 그렇지 않은 곳보다 매출이 높았다는 분석이다.</p>
    <p>한정 메뉴를 너무 많이 낸 곳은 재료 손실이 커 오히려 손해를 봤다.</p>
