    <h1>숏폼 영상 길이, 짧을수록 좋을까</h1>
    <p>카페 계정의 숏폼 영상은 무조건 짧은 것이 좋다는 말이 많다.</p>
    <p>하지만 음료를 만드는 과정을 끝까지 보여 준 20초 안팎의 영상이 오히려 저장 수가 많았다는 분석도 있다.</p>
    <p>길이보다 첫 2초 안에 무엇을 보여 주느냐가 더 중요하다는 것이 공통된 조언이다.</p>
