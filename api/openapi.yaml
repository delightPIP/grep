openapi: 3.1.0
info:
  title: 그렙 API
  version: 0.1.0
  description: |
    클라이언트(웹·iOS·Android)와 서버의 유일한 계약이다(ADR-0001).
    서버는 오류 코드만 돌려주고, 사용자에게 보이는 문구는 클라이언트가 정책 원문(docs/policies)을 쓴다.
    사용자 ID는 접근 토큰에서만 읽는다. 요청 본문이나 주소의 사용자 ID는 받지 않는다(COM-006 규칙 1).
servers:
  - url: http://localhost:8080
security:
  - supabaseJwt: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: 서버 상태 확인
      security: []
      responses:
        "200":
          description: 서버가 요청을 받을 수 있다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /me:
    get:
      operationId: getMe
      summary: 현재 사용자. 처음 부르면 계정을 만든다(ACC-001 규칙 3)
      responses:
        "200":
          description: 현재 사용자
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /items:
    get:
      operationId: listRecentItems
      summary: 최근 저장 자료(`최근`, 찾기 0건 뒤 최근 3건). 휴지통 자료는 빼고 번호 내림차순
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/SavedFrom"
        - $ref: "#/components/parameters/SavedTo"
        - name: kind
          in: query
          description: 자동 묶음 형식(ARC-007 값). image는 이미지 파일, file은 그 밖의 파일
          schema:
            type: string
            enum: [link, text, image, file]
        - name: source
          in: query
          description: 자동 묶음 출처. 링크 호스트, 또는 링크가 아닌 자료 전부를 뜻하는 `direct`(`직접 넣음`)
          schema:
            type: string
        - name: tag
          in: query
          description: 자동 묶음 태그(`#` 없이, 정확히 일치)
          schema:
            type: string
      responses:
        "200":
          description: 자료 한 쪽
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: saveItem
      summary: 링크·글·파일 저장(ARC-001, ARC-005, COM-001, COM-004)
      description: |
        자료 레코드와(파일이면) 원본이 모두 기록돼야 저장 성공이다(ARC-005 규칙 1). 처리(본문·요약·태그)는 따로 한다.
        같은 사용자의 같은 자료(정규화 주소 또는 내용 해시)가 있으면 새로 만들지 않고 기존 자료를 돌려준다(COM-001).
        번호는 저장 성공일 때만 발급한다(ARC-001 규칙 2·4).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveItemRequest"
      responses:
        "201":
          description: 새로 저장했다(`result = saved`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveItemResult"
        "200":
          description: 같은 자료가 있다(`duplicate`, 휴지통이면 `inTrash`). 같은 멱등성 키로 다시 온 요청도 처음 결과를 200으로 돌려준다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveItemResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedFormat"
  /uploads:
    post:
      operationId: createUpload
      summary: 파일 업로드 자리와 서명 URL(ADR-BCK-002 결정 2, COM-004)
      description: |
        클라이언트는 받은 `uploadUrl`로 파일을 PUT한 뒤 `POST /items {kind: file, uploadId}`로 저장한다.
        여기서는 크기(20MB)만 거른다. 형식은 확장자가 아니라 내용으로 정하므로(COM-004 규칙 2) 저장 때 `POST /items`가 판정한다.
        저장에 쓰이지 않은 자리와 객체는 서버가 지운다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: 업로드 자리를 만들었다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/FileTooLarge"
  /uploads/limits:
    get:
      operationId: getUploadLimits
      summary: 받는 형식과 크기 상한(COM-004 규칙 4). 앱이 보내기 전에 미리 거르는 데 쓴다. 최종 판정은 서버가 한다
      responses:
        "200":
          description: 받는 형식 목록과 상한
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadLimits"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /items/search:
    get:
      operationId: searchItems
      summary: 찾기(commands 3절, ARC-002 규칙 5~8). 휴지통 자료는 빼고 최근 저장 순
      description: |
        `q`는 제목·본문·요약·이미지 속 글자·태그에서 부분 일치로 찾는다(PGroonga, ADR-BCK-002 결정 4).
        `tag`는 `#` 없이 여러 번 줄 수 있고, 모든 조건을 만족하는 자료만 돌려준다. 영문 태그는 대소문자를 가리지 않는다(ARC-002 규칙 5).
        `q`와 `tag`가 둘 다 없으면 `invalid_request`다. 기간(`from`·`to`)만으로는 찾지 않는다(시점만 있으면 클라이언트가 `GET /items`를 부른다).
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: tag
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/SavedFrom"
        - $ref: "#/components/parameters/SavedTo"
      responses:
        "200":
          description: 찾은 자료 한 쪽과 전체 건수(`23건 중 10건`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /items/status:
    get:
      operationId: getItemStatuses
      summary: 번호로 자료 찾기. 처리 중 자료 폴링(ARC-005 규칙 10, 2초마다)과 `고르기` 번호 확인(ARC-001 규칙 9·10)에 쓴다
      parameters:
        - name: numbers
          in: query
          required: true
          style: form
          explode: false
          description: 자료 번호를 쉼표로 잇는다(`numbers=30,31`). 개수 제한은 없다(ARC-001 값). 주소가 길어지면 클라이언트가 나눠 부른다
          schema:
            type: array
            minItems: 1
            items:
              type: integer
              format: int64
              minimum: 1
      responses:
        "200":
          description: 있는 자료와, 없거나 휴지통에 있는 번호
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemLookup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /items/trash:
    post:
      operationId: trashItems
      summary: 버리기(ARC-008 규칙 1). 자료를 휴지통으로 옮긴다
      description: |
        번호 범위 `a-b`는 클라이언트가 번호 목록으로 펼쳐 보낸다(ARC-001 비고, ARC-010 규칙 6).
        번호 중 하나라도 없거나 이미 휴지통에 있으면 아무것도 옮기지 않고 `not_found`(ARC-001 규칙 10).
        2건 이상이면 클라이언트가 먼저 확인을 받는다(ARC-008 규칙 1, COM-007). 서버는 묻지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NumbersRequest"
      responses:
        "200":
          description: 옮긴 자료, 요청 순서
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemRefList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      operationId: listTrash
      summary: 휴지통 목록(ARC-008 규칙 5·10). 지운 날 최신순, 남은 날 포함
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 휴지통 한 쪽과 전체 건수(`휴지통 비우기` 확인에 쓴다)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: emptyTrash
      summary: 휴지통 비우기(ARC-008 규칙 6). 휴지통 자료를 모두 영구 삭제한다. 확인은 클라이언트가 먼저 받는다
      responses:
        "200":
          description: 영구 삭제한 건수. 번호는 다시 쓰지 않는다(ARC-001 규칙 6)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /items/restore:
    post:
      operationId: restoreItems
      summary: 되살리기(ARC-008 규칙 4). 번호는 그대로 돌아온다
      description: 번호 중 하나라도 휴지통에 없으면 아무것도 되살리지 않고 `not_found`(ARC-001 규칙 10의 `되살리기` 예외).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NumbersRequest"
      responses:
        "200":
          description: 되살린 자료, 요청 순서
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemRefList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /items/{number}:
    get:
      operationId: getItemDetail
      summary: 자세히 보기(`열기`, ARC-011). 휴지통·없는 번호는 `not_found`
      parameters:
        - $ref: "#/components/parameters/ItemNumber"
      responses:
        "200":
          description: 자료 하나
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: reviseItem
      summary: 고치기(commands 3절, ARC-002 규칙 2·3, ARC-004)
      description: |
        `title`·`summary`·`removeTags` 중 하나 이상. 고친 제목·요약은 다시 처리해도 덮어쓰지 않고, 고친 요약은 `summarySource = user`가 된다.
        지운 태그는 그 자료에 다시 붙이지 않는다. 고쳐도 태그를 다시 만들지 않는다.
        AI 요약으로 되돌리기는 받지 않는다(04 질문 17, 정하지 않음). 휴지통 자료는 `not_found`.
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviseItemRequest"
      responses:
        "200":
          description: 고친 자료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /samples:
    post:
      operationId: saveSamples
      summary: 샘플 8건 저장(ARC-010). 다음 번호부터 8개를 한꺼번에
      description: |
        하나라도 실패하면 아무것도 저장하지 않는다(규칙 3). 이미 받은 사용자가 다시 부르면 새로 만들지 않고 처음 받은 범위를 200으로 돌려준다(규칙 7).
        요약·태그는 미리 만든 값이라 처리 작업과 하루 AI 처리 한도를 쓰지 않는다.
      responses:
        "201":
          description: 새로 저장했다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleResult"
        "200":
          description: 이미 받았다. 처음 받은 범위
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /events:
    post:
      operationId: recordEvent
      summary: 클라이언트가 아는 측정 이벤트(PRD 4절, D-08). 지금은 `handoff_copied`만
      description: |
        클립보드 복사에 성공한 뒤에만 보낸다(08 6절 개발 답 9). `item_saved`는 서버가 저장 때 직접 남긴다.
        서버는 번호로 건수와 저장 뒤 지난 일수를 계산해 남기고, 번호·제목·본문·검색어는 남기지 않는다.
        이벤트를 남기지 못해도 사용자 동작은 실패로 보이지 않는다(클라이언트는 결과를 기다리지 않는다).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRequest"
      responses:
        "204":
          description: 받았다
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /groups:
    get:
      operationId: listAutoGroups
      summary: 보관함 자동 묶음(ARC-007). 형식·출처·날짜·태그별 건수. 0건 묶음은 빼고, 휴지통 자료는 세지 않는다
      parameters:
        - name: tz
          in: query
          description: 날짜 묶음(오늘·이번 주·이번 달·그 전)을 나눌 기기 시간대(IANA, 예 Asia/Seoul). 없으면 Asia/Seoul
          schema:
            type: string
      responses:
        "200":
          description: 자동 묶음 건수
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoGroups"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bundles:
    get:
      operationId: listBundles
      summary: 묶음 목록(`묶음`, ARC-003 규칙 18). 최근에 바뀐 순, 0건 묶음 포함
      responses:
        "200":
          description: 묶음 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bundles/{name}:
    get:
      operationId: getBundle
      summary: 묶음 보기(`묶음 <이름>`, ARC-003 규칙 20). 자료 번호 큰 순, 휴지통 자료는 빼고 센다(규칙 25)
      parameters:
        - $ref: "#/components/parameters/BundleName"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 묶음 안 자료 한 쪽
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundlePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteBundle
      summary: 묶음 지우기(규칙 23). 묶음만 지우고 자료는 남긴다. 확인은 클라이언트가 먼저 받는다
      parameters:
        - $ref: "#/components/parameters/BundleName"
      responses:
        "204":
          description: 지웠다
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bundles/{name}/items:
    post:
      operationId: addToBundle
      summary: 묶음에 넣기(`묶음 <이름>` + 선택, 규칙 19·21). 없는 이름이면 만든다. 이미 있는 자료는 한 번만 둔다
      description: |
        이름은 서버가 판정한다(ARC-003 값: 띄어쓰기 없이 1~20자, 한글·영문·숫자·`-`·`_`, 숫자만·`#` 시작·`빼기`·`지우기` 금지, 영문 대소문자 무시).
        번호 중 하나라도 없거나 휴지통이면 아무것도 넣지 않고 `not_found`(ARC-001 규칙 10).
      parameters:
        - $ref: "#/components/parameters/BundleName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NumbersRequest"
      responses:
        "200":
          description: 넣은 뒤 묶음 건수
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleAddResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bundles/{name}/items/remove:
    post:
      operationId: removeFromBundle
      summary: 묶음에서 빼기(`묶음 <이름> 빼기 <번호…>`, 규칙 22). 자료는 지우지 않는다
      description: 묶음에 없는 번호가 하나라도 있으면 아무것도 빼지 않고 `not_in_bundle`과 그 번호들(`✗ 묶음에 없음`)
      parameters:
        - $ref: "#/components/parameters/BundleName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NumbersRequest"
      responses:
        "200":
          description: 뺀 뒤 남은 건수
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /saved-searches:
    get:
      operationId: listSavedSearches
      summary: 찾아둔 목록(`찾아두기`, ARC-012). 만든 순 최신부터, 0건 포함, 건수는 지금 다시 센 값
      responses:
        "200":
          description: 찾아둔 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearchList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: saveSearch
      summary: 찾아두기(`찾아두기 <검색어>`). 같은 검색어(공백 정리 뒤)가 있으면 200, 새로 만들면 201
      description: |
        검색어는 1~40자(ARC-012 값). 시점 낱말은 클라이언트가 먼저 거른다(규칙 4). 결과는 같은 검색어로 `GET /items/search`를 부른다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedSearchRequest"
      responses:
        "201":
          description: 새로 찾아뒀다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
        "200":
          description: 이미 찾아뒀다(`! 이미 찾아둠`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteSavedSearch
      summary: 찾아둔 것 지우기(`찾아두기 <검색어> 지우기`, 규칙 7). 자료는 남는다. 확인은 클라이언트가 먼저 받는다
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 지웠다
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /connections:
    get:
      operationId: listConnections
      summary: AI 도구 연결 목록과 연결 주소(`연결`, ACC-002 규칙 7·10)
      responses:
        "200":
          description: 연결 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /connections/{number}:
    delete:
      operationId: endConnection
      summary: 연결 끊기(`연결 끊기 <번호>`, ACC-002 규칙 6·8·9). 다음 요청부터 거부한다. 확인은 클라이언트가 먼저 받는다
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 끊었거나(`ended`) 이미 끊긴 연결(`alreadyEnded`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndConnectionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /connections/revoke-all:
    post:
      operationId: endAllConnections
      summary: 모든 AI 도구 연결 끊기(ACC-002 규칙 4). `로그아웃 모든기기` 확인 뒤 클라이언트가 Supabase 전역 로그아웃 전에 부른다
      responses:
        "200":
          description: 끊은 연결 수
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /connections/notices:
    post:
      operationId: takeConnectionNotices
      summary: 사용자가 모르는 사이 끊긴 연결(만료 등)을 한 번만 돌려주고 본 것으로 표시한다(ACC-002 규칙 11). 그렙을 열 때 부른다
      responses:
        "200":
          description: 알릴 끊긴 연결
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionNotices"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /imports:
    post:
      operationId: startImport
      summary: 북마크 가져오기 시작(`가져오기`, F8). 뒤에서 진행한다
      description: |
        브라우저에서 내보낸 북마크 HTML을 글로 보낸다. 한 번에 200건까지 가져오고(발표 전 임시값, 공통 열린 질문) 넘는 링크는 `overLimit`으로 센다.
        같은 링크는 건너뛴다(COM-001). 가져온 자료는 처리 작업을 만들지 않고, 처음 열거나 넘길 때 요약한다(user-flow 10절, ADR-BCK-008).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "202":
          description: 시작했다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /imports/{id}:
    get:
      operationId: getImport
      summary: 가져오기 진행(`· 가져오는 중  N / M건`)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 진행 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /handoff:
    post:
      operationId: createHandoff
      summary: 넘길 글 조립(handoff-format, ARC-004). AI 도구 연결과 같은 함수를 쓴다
      description: |
        고른 순서대로 넘길 글을 만든다. 처리 중 자료는 요약을 기다리지 않는다(05 H-03).
        요약이 없으면 지어내지 않고 없는 이유를 쓴다(ARC-004 규칙 6).
        번호 중 하나라도 없거나 휴지통에 있으면 아무것도 만들지 않고 `not_found`로 답한다(ARC-001 규칙 10).
        `bundle`을 주면 그 묶음의 자료(번호 큰 순)를 넘기고, 휴지통·영구 삭제로 빠진 수를 `removedCount`로 준다(`! 빠진 자료 N건`, ARC-003 사용자 문구). 여는 줄에 `묶음="<이름>"`을 더한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoffRequest"
      responses:
        "200":
          description: 넘길 글
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Handoff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    Cursor:
      name: cursor
      in: query
      description: 앞 응답의 `nextCursor`. 없으면 처음부터
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: 한 쪽 건수. 기본 10(commands 3절)
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    ItemNumber:
      name: number
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    BundleName:
      name: name
      in: path
      required: true
      description: 묶음 이름(URL 인코딩). 영문 대소문자는 가리지 않는다
      schema:
        type: string
    SavedFrom:
      name: from
      in: query
      description: 저장 시각이 이 시각 이상(F22 시점). 한국 시간 기준 경계는 클라이언트가 계산해 RFC 3339로 보낸다(주는 월요일 시작)
      schema:
        type: string
        format: date-time
    SavedTo:
      name: to
      in: query
      description: 저장 시각이 이 시각 미만(반열린 구간)
      schema:
        type: string
        format: date-time
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 클라이언트가 저장 시도마다 만드는 UUID. 같은 사용자·같은 키면 처음 결과를 돌려준다
      schema:
        type: string
        format: uuid
  securitySchemes:
    supabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth 접근 토큰. 서버는 JWKS(ES256)로 검증한다(ADR-BCK-006 결정 5)
  responses:
    Unauthorized:
      description: |
        토큰 없음·서명 틀림·토큰 만료는 `unauthorized`.
        세션이 30일 미사용이거나 90일을 넘었으면 `session_expired`(ACC-001 값).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: 요청 본문이 계약과 다르다(`invalid_request`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    FileTooLarge:
      description: 파일이 크기 상한(20MB, COM-004 규칙 8)을 넘었다(`file_too_large`). `fileName`·`bytes`를 함께 준다
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedFormat:
      description: 받지 않는 형식이다(`unsupported_format`, COM-004 규칙 3). 내용 판별 결과의 `fileExtension`을 함께 준다
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 없는 번호 또는 휴지통 자료의 번호다(`not_found`, ARC-001 규칙 10). `numbers`에 그 번호들을 준다
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Me:
      type: object
      required: [userId, authProvider, itemCount]
      properties:
        userId:
          type: string
          format: uuid
        authProvider:
          type: string
          enum: [google, github]
        itemCount:
          type: integer
          minimum: 0
          description: 상태줄 `자료 N`. 휴지통에 있는 자료는 세지 않는다
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum:
            - unauthorized
            - session_expired
            - invalid_request
            - file_too_large
            - unsupported_format
            - not_found
            - invalid_bundle_name
            - not_in_bundle
        reason:
          type: string
          enum: [format, reserved]
          description: "`invalid_bundle_name`일 때. format = 글자·길이 규칙, reserved = 숫자만·`#` 시작·`빼기`·`지우기`"
        numbers:
          type: array
          items:
            type: integer
            format: int64
          description: "`not_found`·`not_in_bundle`일 때 그 번호들"
        fileName:
          type: string
          description: "`file_too_large`일 때"
        bytes:
          type: integer
          minimum: 0
          description: "`file_too_large`일 때"
        fileExtension:
          type: string
          description: "`unsupported_format`일 때. 점 없이(`zip`)"
    SaveItemRequest:
      description: |
        링크는 `http`·`https`만(COM-001 값). 그 밖의 스킴은 클라이언트가 글로 보낸다.
        파일은 `POST /uploads`로 받은 `uploadId`로 보낸다.
      oneOf:
        - type: object
          required: [kind, url]
          properties:
            kind:
              type: string
              const: link
            url:
              type: string
              format: uri
        - type: object
          required: [kind, text]
          properties:
            kind:
              type: string
              const: text
            text:
              type: string
              minLength: 1
        - type: object
          required: [kind, uploadId]
          properties:
            kind:
              type: string
              const: file
            uploadId:
              type: string
              format: uuid
      discriminator:
        propertyName: kind
    SaveItemResult:
      type: object
      required: [result, item]
      properties:
        result:
          type: string
          enum: [saved, duplicate, inTrash]
          description: |
            saved = 새로 저장. duplicate = 같은 자료가 있어 그 자료를 돌려줌(COM-001 규칙 3).
            inTrash = 같은 자료가 휴지통에 있음(COM-001 규칙 7, ARC-008 규칙 8)
        item:
          $ref: "#/components/schemas/ItemSummary"
    ItemSummary:
      type: object
      description: 목록 한 줄에 필요한 값. 자료는 사용자별 번호로만 가리킨다(ARC-001)
      required: [number, kind, title, source, status, blockedReason, listSummary, summarySource, partialNote, tags, matchedIn, savedAt]
      properties:
        number:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
          enum: [link, text, file]
        title:
          type: string
          description: 링크는 페이지 제목(처리 전이면 주소), 글은 첫 줄 24자까지, 파일은 파일 이름
        source:
          type: [string, "null"]
          description: 링크는 호스트, 파일은 형식(`pdf` 등)
        status:
          $ref: "#/components/schemas/ItemStatus"
        blockedReason:
          type: [string, "null"]
          enum: [login_required, access_denied, disallowed_url, encrypted, no_text, null]
          description: "`blocked`일 때 이유(ARC-005, COM-004 규칙 6)"
        listSummary:
          type: [string, "null"]
          description: 흐린 한 줄 요약. 직접 고친 요약이 있으면 그것(ARC-004)
        summarySource:
          type: [string, "null"]
          enum: [ai, user, null]
          description: ARC-004 규칙 5
        partialNote:
          type: [string, "null"]
          description: 일부만 읽었을 때 요약 끝에 붙일 말(ARC-004 규칙 8)
        tags:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 20
          description: 자동 태그, `#` 없이(ARC-002 값 0~5개, 1~20자)
        matchedIn:
          type: [string, "null"]
          enum: [title, source, summary, body, imageText, tag, null]
          description: 찾기 결과에서 일치한 곳. 요약 줄 끝에 흐리게(`이미지 속 글자`, commands 6절 목록 꼬리표). 찾기가 아니면 null
        savedAt:
          type: string
          format: date-time
    ItemStatus:
      type: string
      enum: [received, processing, ready, blocked, failed]
      description: ARC-005 처리 상태. 이 다섯 가지뿐이다
    CreateUploadRequest:
      type: object
      required: [fileName, size]
      properties:
        fileName:
          type: string
          minLength: 1
        size:
          type: integer
          format: int64
          minimum: 0
          description: 바이트
    Upload:
      type: object
      required: [uploadId, uploadUrl, expiresAt]
      properties:
        uploadId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
          description: 파일을 PUT할 서명 URL(비공개 버킷 items)
        expiresAt:
          type: string
          format: date-time
    ItemPage:
      type: object
      required: [items, total, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
        total:
          type: [integer, "null"]
          minimum: 0
          description: 기간(`from`·`to`)이 있을 때 그 기간 휴지통 밖 자료의 전체 건수, 없으면 null
        nextCursor:
          type: [string, "null"]
          description: 다음 쪽이 없으면 null
    SearchPage:
      type: object
      required: [items, total, nextCursor, isSavedSearch, related]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
        total:
          type: integer
          minimum: 0
          description: 조건에 맞는 전체 건수
        nextCursor:
          type: [string, "null"]
        isSavedSearch:
          type: boolean
          description: 같은 검색어(`q` 낱말 차례와 `tag`, ARC-012 규칙 2 공백 정리)를 찾아뒀으면 true. 시점(`from`·`to`)은 비교하지 않는다. true면 `찾아두기 <검색어>` 칩을 두지 않는다(ARC-012 규칙 9)
        related:
          type: array
          maxItems: 3
          description: |
            뜻이 가까운 자료(F15, ADR-BCK-016). `total`이 0일 때만 채우고 그 밖에는 빈 배열이다. 가까운 순 최대 3건.
            휴지통 자료와 남의 자료는 빼고(COM-006), 기간(`from`·`to`)이 있으면 그 안에서만 찾는다. 임베딩이 아직 없는 자료는 빠진다.
            검색어 임베딩을 받지 못하면 빈 배열이다
          items:
            $ref: "#/components/schemas/ItemSummary"
    ItemLookup:
      type: object
      required: [items, missing]
      properties:
        items:
          type: array
          description: 요청한 순서대로, 있는 자료만
          items:
            $ref: "#/components/schemas/ItemSummary"
        missing:
          type: array
          description: 없거나 휴지통·영구 삭제한 자료의 번호(`✗ 없는 번호`, ARC-001 규칙 10)
          items:
            type: integer
            format: int64
    UploadLimits:
      type: object
      required: [formats, maxBytes]
      properties:
        formats:
          type: array
          description: COM-004 값 표의 받는 형식
          items:
            type: string
            enum: [pdf, md, txt, docx, png, jpeg, webp, heic]
        maxBytes:
          type: integer
          format: int64
          description: 20MB(COM-004 규칙 7·8)
    ItemDetail:
      type: object
      description: 자세히 보기(ARC-011 규칙 6). 문구와 차례는 클라이언트가 정책대로 그린다
      required: [item, url, handoffSummary, allTags, bundles, bodyLength, body, bodyFromImage, originalUrl, previewUrl]
      properties:
        item:
          $ref: "#/components/schemas/ItemSummary"
        url:
          type: [string, "null"]
          description: 링크의 원래 주소에서 추적 꼬리표만 뺀 사람용 주소(넘길 글 출처 칸과 같은 값, COM-001 정규화 주소와 다름). 출처 호스트를 누르면 새 탭으로 연다(ARC-011 규칙 6-2). 링크가 아니면 null
        handoffSummary:
          type: [string, "null"]
          description: 넘기기용 요약 또는 직접 고친 요약(`summarySource`로 이름표). 없으면 null
        allTags:
          type: array
          items:
            type: string
          description: 태그 전부(목록은 앞 3개, ARC-002 규칙 4)
        bundles:
          type: array
          items:
            type: string
          description: 이 자료가 든 묶음 이름들. 없으면 빈 배열(`묶음  없음`)
        bodyLength:
          type: [integer, "null"]
          minimum: 0
          description: 본문 전체 글자 수(`본문 3,420자`). `body`가 null이면 null(처리 전이거나 본문을 읽지 못했거나, 본문 저장 전에 처리한 자료. `status`로 구분한다)
        body:
          type: [string, "null"]
          description: "본문 텍스트(펼치기용, 앞 2만 자). 본문이 없으면 null(`· 본문 없음: <이유>`)"
        bodyFromImage:
          type: boolean
          description: 이미지에서 읽은 글자면 true(`본문 (이미지에서 읽음)`)
        originalUrl:
          type: [string, "null"]
          format: uri
          description: 파일 원본을 여는 서명 URL(유효 10분, ARC-011 비고). 링크·글은 null
        previewUrl:
          type: [string, "null"]
          format: uri
          description: 이미지 미리보기 서명 URL(유효 10분). 이미지가 아니면 null. PDF 첫 쪽 그림은 아직 없다
    AutoGroups:
      type: object
      required: [kinds, sources, periods, tags]
      properties:
        kinds:
          type: array
          items:
            $ref: "#/components/schemas/GroupCount"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/GroupCount"
        periods:
          type: array
          description: key는 today, thisWeek, thisMonth, earlier
          items:
            $ref: "#/components/schemas/GroupCount"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/GroupCount"
    GroupCount:
      type: object
      required: [key, count]
      properties:
        key:
          type: string
        count:
          type: integer
          minimum: 1
    BundleSummary:
      type: object
      required: [name, count, updatedAt]
      properties:
        name:
          type: string
        count:
          type: integer
          minimum: 0
          description: 휴지통 밖 자료 수
        updatedAt:
          type: string
          format: date-time
    BundleList:
      type: object
      required: [bundles]
      properties:
        bundles:
          type: array
          items:
            $ref: "#/components/schemas/BundleSummary"
    BundlePage:
      type: object
      required: [name, total, items, nextCursor]
      properties:
        name:
          type: string
        total:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
        nextCursor:
          type: [string, "null"]
    BundleAddResult:
      type: object
      required: [name, count, alreadyCount]
      properties:
        name:
          type: string
          description: 저장된 표기(처음 만든 대로)
        count:
          type: integer
          minimum: 0
          description: "넣은 뒤 묶음 건수(`✓ 묶음 <이름>: N건`)"
        alreadyCount:
          type: integer
          minimum: 0
          description: 요청 중 이미 있던 자료 수(`(이미 있음 M건)`)
    SavedSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 40
    SavedSearch:
      type: object
      required: [query, count]
      properties:
        query:
          type: string
          description: 공백 정리 뒤 저장된 검색어
        count:
          type: integer
          minimum: 0
    SavedSearchList:
      type: object
      required: [searches]
      properties:
        searches:
          type: array
          items:
            $ref: "#/components/schemas/SavedSearch"
    Connection:
      type: object
      required: [number, client, connectedAt, lastReadAt]
      properties:
        number:
          type: integer
          minimum: 1
          description: 연결 번호(사용자별, 끊기에 쓴다)
        client:
          type: string
          description: AI 도구 이름(OAuth 클라이언트 등록 이름)
        connectedAt:
          type: string
          format: date-time
        lastReadAt:
          type: [string, "null"]
          format: date-time
    ConnectionList:
      type: object
      required: [mcpUrl, connections]
      properties:
        mcpUrl:
          type: string
          format: uri
          description: "`· 연결 주소  https://<그렙 주소>/mcp`"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
    EndConnectionResult:
      type: object
      required: [result, client]
      properties:
        result:
          type: string
          enum: [ended, alreadyEnded]
        client:
          type: string
    ConnectionNotices:
      type: object
      required: [ended]
      properties:
        ended:
          type: array
          items:
            type: object
            required: [client, reason]
            properties:
              client:
                type: string
              reason:
                type: string
                enum: [expired, revoked]
                description: expired = 토큰 만료, revoked = 다른 기기에서 끊음·모든 기기 로그아웃
    ImportRequest:
      type: object
      required: [html]
      properties:
        html:
          type: string
          minLength: 1
          description: 브라우저가 내보낸 북마크 HTML(Netscape 형식) 전체
    ImportStatus:
      type: object
      required: [id, state, total, done, saved, skipped, failed, overLimit, failedUrls]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [running, finished]
        total:
          type: integer
          minimum: 0
          description: 가져올 링크 수(200 이하)
        done:
          type: integer
          minimum: 0
        saved:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
          description: 이미 저장됨
        failed:
          type: integer
          minimum: 0
        overLimit:
          type: integer
          minimum: 0
          description: 200건을 넘어 가져오지 않은 링크 수
        failedUrls:
          type: array
          items:
            type: string
    NumbersRequest:
      type: object
      required: [numbers]
      properties:
        numbers:
          type: array
          minItems: 1
          description: 자료 번호. 같은 번호가 두 번 오면 처음 것만 쓴다
          items:
            type: integer
            format: int64
            minimum: 1
    ItemRefList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [number, title]
            properties:
              number:
                type: integer
                format: int64
              title:
                type: string
    CountResult:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          minimum: 0
    TrashItem:
      type: object
      required: [item, trashedAt, daysLeft]
      properties:
        item:
          $ref: "#/components/schemas/ItemSummary"
        trashedAt:
          type: string
          format: date-time
        daysLeft:
          type: integer
          minimum: 0
          description: 영구 삭제까지 남은 날(`30일 남음`, ARC-008 규칙 10). 서버가 한국 시간 날짜로 계산한다
    TrashPage:
      type: object
      required: [items, total, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrashItem"
        total:
          type: integer
          minimum: 0
        nextCursor:
          type: [string, "null"]
    ReviseItemRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        removeTags:
          type: array
          minItems: 1
          description: 지울 태그, `#` 없이. 자료에 없는 태그는 무시한다
          items:
            type: string
    SampleResult:
      type: object
      required: [firstNumber, lastNumber]
      properties:
        firstNumber:
          type: integer
          format: int64
        lastNumber:
          type: integer
          format: int64
          description: 받은 범위. 완료 줄과 `버리기 <a>-<b>` 안내에 쓴다(ARC-010 규칙 4·6)
    EventRequest:
      type: object
      required: [name, numbers, method]
      properties:
        name:
          type: string
          const: handoff_copied
        numbers:
          type: array
          minItems: 1
          description: 넘긴 자료 번호. 서버가 건수와 저장 뒤 지난 일수를 계산하는 데만 쓰고 번호 자체는 남기지 않는다
          items:
            type: integer
            format: int64
            minimum: 1
        method:
          type: string
          enum: [pick, pipe]
          description: 방식. pick = 고른 자료, pipe = `찾기 … | 넘기기`
    HandoffRequest:
      type: object
      description: "`numbers`와 `bundle` 중 하나만 준다"
      properties:
        bundle:
          type: string
          description: 묶음 이름(`넘기기 <이름>`)
        numbers:
          type: array
          minItems: 1
          description: 고른 순서. 같은 번호가 두 번 오면 서버가 처음 것만 쓴다(ARC-001 값)
          items:
            type: integer
            format: int64
            minimum: 1
    Handoff:
      type: object
      required: [text, charCount, items, missingSummaryCount]
      properties:
        text:
          type: string
          description: 클립보드에 넣을 글 전체(handoff-format)
        charCount:
          type: integer
          minimum: 0
          description: "`text`의 글자 수(유니코드 문자, 줄바꿈 포함). `✓ 복사됨  2건 · 442자`"
        items:
          type: array
          description: 넘긴 자료마다 `<번호>  <제목>` 한 줄
          items:
            type: object
            required: [number, title]
            properties:
              number:
                type: integer
                format: int64
              title:
                type: string
        missingSummaryCount:
          type: integer
          minimum: 0
          description: "`! 요약 없음 N건`"
        bundle:
          type: [string, "null"]
          description: 묶음으로 넘겼으면 그 이름
        removedCount:
          type: integer
          minimum: 0
          description: 묶음으로 넘길 때 휴지통·영구 삭제로 빠진 자료 수. 묶음이 아니면 0
