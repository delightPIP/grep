openapi: 3.1.0
info:
  title: 그렙 API
  version: 0.1.0
  description: |
    클라이언트(웹·iOS·Android)와 서버의 유일한 계약이다(ADR-0001).
    서버는 오류 코드만 돌려주고, 사용자에게 보이는 문구는 클라이언트가 정책 원문(docs/policies)을 쓴다.
    사용자 ID는 접근 토큰에서만 읽는다. 요청 본문이나 주소의 사용자 ID는 받지 않는다(COM-006 규칙 1).
servers:
  - url: http://localhost:8080
security:
  - supabaseJwt: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: 서버 상태 확인
      security: []
      responses:
        "200":
          description: 서버가 요청을 받을 수 있다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /me:
    get:
      operationId: getMe
      summary: 현재 사용자. 처음 부르면 계정을 만든다(ACC-001 규칙 3)
      responses:
        "200":
          description: 현재 사용자
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /items:
    get:
      operationId: listRecentItems
      summary: 최근 저장 자료(`최근`, 찾기 0건 뒤 최근 3건). 휴지통 자료는 빼고 번호 내림차순
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/SavedFrom"
        - $ref: "#/components/parameters/SavedTo"
      responses:
        "200":
          description: 자료 한 쪽
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: saveItem
      summary: 링크·글·파일 저장(ARC-001, ARC-005, COM-001, COM-004)
      description: |
        자료 레코드와(파일이면) 원본이 모두 기록돼야 저장 성공이다(ARC-005 규칙 1). 처리(본문·요약·태그)는 따로 한다.
        같은 사용자의 같은 자료(정규화 주소 또는 내용 해시)가 있으면 새로 만들지 않고 기존 자료를 돌려준다(COM-001).
        번호는 저장 성공일 때만 발급한다(ARC-001 규칙 2·4).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveItemRequest"
      responses:
        "201":
          description: 새로 저장했다(`result = saved`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveItemResult"
        "200":
          description: 같은 자료가 있다(`duplicate`, 휴지통이면 `inTrash`). 같은 멱등성 키로 다시 온 요청도 처음 결과를 200으로 돌려준다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveItemResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedFormat"
  /uploads:
    post:
      operationId: createUpload
      summary: 파일 업로드 자리와 서명 URL(ADR-BCK-002 결정 2, COM-004)
      description: |
        클라이언트는 받은 `uploadUrl`로 파일을 PUT한 뒤 `POST /items {kind: file, uploadId}`로 저장한다.
        여기서는 크기(20MB)만 거른다. 형식은 확장자가 아니라 내용으로 정하므로(COM-004 규칙 2) 저장 때 `POST /items`가 판정한다.
        저장에 쓰이지 않은 자리와 객체는 서버가 지운다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: 업로드 자리를 만들었다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/FileTooLarge"
  /uploads/limits:
    get:
      operationId: getUploadLimits
      summary: 받는 형식과 크기 상한(COM-004 규칙 4). 앱이 보내기 전에 미리 거르는 데 쓴다. 최종 판정은 서버가 한다
      responses:
        "200":
          description: 받는 형식 목록과 상한
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadLimits"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /items/search:
    get:
      operationId: searchItems
      summary: 찾기(commands 3절, ARC-002 규칙 5~8). 휴지통 자료는 빼고 최근 저장 순
      description: |
        `q`는 제목·본문·요약·이미지 속 글자·태그에서 부분 일치로 찾는다(PGroonga, ADR-BCK-002 결정 4).
        `tag`는 `#` 없이 여러 번 줄 수 있고, 모든 조건을 만족하는 자료만 돌려준다. 영문 태그는 대소문자를 가리지 않는다(ARC-002 규칙 5).
        `q`와 `tag`가 둘 다 없으면 `invalid_request`다. 기간(`from`·`to`)만으로는 찾지 않는다(시점만 있으면 클라이언트가 `GET /items`를 부른다).
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: tag
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/SavedFrom"
        - $ref: "#/components/parameters/SavedTo"
      responses:
        "200":
          description: 찾은 자료 한 쪽과 전체 건수(`23건 중 10건`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /items/status:
    get:
      operationId: getItemStatuses
      summary: 번호로 자료 찾기. 처리 중 자료 폴링(ARC-005 규칙 10, 2초마다)과 `고르기` 번호 확인(ARC-001 규칙 9·10)에 쓴다
      parameters:
        - name: numbers
          in: query
          required: true
          style: form
          explode: false
          description: 자료 번호를 쉼표로 잇는다(`numbers=30,31`). 개수 제한은 없다(ARC-001 값). 주소가 길어지면 클라이언트가 나눠 부른다
          schema:
            type: array
            minItems: 1
            items:
              type: integer
              format: int64
              minimum: 1
      responses:
        "200":
          description: 있는 자료와, 없거나 휴지통에 있는 번호
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemLookup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /items/trash:
    post:
      operationId: trashItems
      summary: 버리기(ARC-008 규칙 1). 자료를 휴지통으로 옮긴다
      description: |
        번호 범위 `a-b`는 클라이언트가 번호 목록으로 펼쳐 보낸다(ARC-001 비고, ARC-010 규칙 6).
        번호 중 하나라도 없거나 이미 휴지통에 있으면 아무것도 옮기지 않고 `not_found`(ARC-001 규칙 10).
        2건 이상이면 클라이언트가 먼저 확인을 받는다(ARC-008 규칙 1, COM-007). 서버는 묻지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NumbersRequest"
      responses:
        "200":
          description: 옮긴 자료, 요청 순서
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemRefList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      operationId: listTrash
      summary: 휴지통 목록(ARC-008 규칙 5·10). 지운 날 최신순, 남은 날 포함
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 휴지통 한 쪽과 전체 건수(`휴지통 비우기` 확인에 쓴다)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: emptyTrash
      summary: 휴지통 비우기(ARC-008 규칙 6). 휴지통 자료를 모두 영구 삭제한다. 확인은 클라이언트가 먼저 받는다
      responses:
        "200":
          description: 영구 삭제한 건수. 번호는 다시 쓰지 않는다(ARC-001 규칙 6)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /items/restore:
    post:
      operationId: restoreItems
      summary: 되살리기(ARC-008 규칙 4). 번호는 그대로 돌아온다
      description: 번호 중 하나라도 휴지통에 없으면 아무것도 되살리지 않고 `not_found`(ARC-001 규칙 10의 `되살리기` 예외).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NumbersRequest"
      responses:
        "200":
          description: 되살린 자료, 요청 순서
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemRefList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /items/{number}:
    patch:
      operationId: reviseItem
      summary: 고치기(commands 3절, ARC-002 규칙 2·3, ARC-004)
      description: |
        `title`·`summary`·`removeTags` 중 하나 이상. 고친 제목·요약은 다시 처리해도 덮어쓰지 않고, 고친 요약은 `summarySource = user`가 된다.
        지운 태그는 그 자료에 다시 붙이지 않는다. 고쳐도 태그를 다시 만들지 않는다.
        AI 요약으로 되돌리기는 받지 않는다(04 질문 17, 정하지 않음). 휴지통 자료는 `not_found`.
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviseItemRequest"
      responses:
        "200":
          description: 고친 자료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /samples:
    post:
      operationId: saveSamples
      summary: 샘플 8건 저장(ARC-010). 다음 번호부터 8개를 한꺼번에
      description: |
        하나라도 실패하면 아무것도 저장하지 않는다(규칙 3). 이미 받은 사용자가 다시 부르면 새로 만들지 않고 처음 받은 범위를 200으로 돌려준다(규칙 7).
        요약·태그는 미리 만든 값이라 처리 작업과 하루 AI 처리 한도를 쓰지 않는다.
      responses:
        "201":
          description: 새로 저장했다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleResult"
        "200":
          description: 이미 받았다. 처음 받은 범위
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /events:
    post:
      operationId: recordEvent
      summary: 클라이언트가 아는 측정 이벤트(PRD 4절, D-08). 지금은 `handoff_copied`만
      description: |
        클립보드 복사에 성공한 뒤에만 보낸다(08 6절 개발 답 9). `item_saved`는 서버가 저장 때 직접 남긴다.
        서버는 번호로 건수와 저장 뒤 지난 일수를 계산해 남기고, 번호·제목·본문·검색어는 남기지 않는다.
        이벤트를 남기지 못해도 사용자 동작은 실패로 보이지 않는다(클라이언트는 결과를 기다리지 않는다).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRequest"
      responses:
        "204":
          description: 받았다
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /handoff:
    post:
      operationId: createHandoff
      summary: 넘길 글 조립(handoff-format, ARC-004). AI 도구 연결과 같은 함수를 쓴다
      description: |
        고른 순서대로 넘길 글을 만든다. 처리 중 자료는 요약을 기다리지 않는다(05 H-03).
        요약이 없으면 지어내지 않고 없는 이유를 쓴다(ARC-004 규칙 6).
        번호 중 하나라도 없거나 휴지통에 있으면 아무것도 만들지 않고 `not_found`로 답한다(ARC-001 규칙 10).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoffRequest"
      responses:
        "200":
          description: 넘길 글
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Handoff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    Cursor:
      name: cursor
      in: query
      description: 앞 응답의 `nextCursor`. 없으면 처음부터
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: 한 쪽 건수. 기본 10(commands 3절)
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    SavedFrom:
      name: from
      in: query
      description: 저장 시각이 이 시각 이상(F22 시점). 한국 시간 기준 경계는 클라이언트가 계산해 RFC 3339로 보낸다(주는 월요일 시작)
      schema:
        type: string
        format: date-time
    SavedTo:
      name: to
      in: query
      description: 저장 시각이 이 시각 미만(반열린 구간)
      schema:
        type: string
        format: date-time
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 클라이언트가 저장 시도마다 만드는 UUID. 같은 사용자·같은 키면 처음 결과를 돌려준다
      schema:
        type: string
        format: uuid
  securitySchemes:
    supabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth 접근 토큰. 서버는 JWKS(ES256)로 검증한다(ADR-BCK-006 결정 5)
  responses:
    Unauthorized:
      description: |
        토큰 없음·서명 틀림·토큰 만료는 `unauthorized`.
        세션이 30일 미사용이거나 90일을 넘었으면 `session_expired`(ACC-001 값).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: 요청 본문이 계약과 다르다(`invalid_request`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    FileTooLarge:
      description: 파일이 크기 상한(20MB, COM-004 규칙 8)을 넘었다(`file_too_large`). `fileName`·`bytes`를 함께 준다
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedFormat:
      description: 받지 않는 형식이다(`unsupported_format`, COM-004 규칙 3). 내용 판별 결과의 `fileExtension`을 함께 준다
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 없는 번호 또는 휴지통 자료의 번호다(`not_found`, ARC-001 규칙 10). `numbers`에 그 번호들을 준다
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Me:
      type: object
      required: [userId, authProvider, itemCount]
      properties:
        userId:
          type: string
          format: uuid
        authProvider:
          type: string
          enum: [google, github]
        itemCount:
          type: integer
          minimum: 0
          description: 상태줄 `자료 N`. 휴지통에 있는 자료는 세지 않는다
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum:
            - unauthorized
            - session_expired
            - invalid_request
            - file_too_large
            - unsupported_format
            - not_found
        numbers:
          type: array
          items:
            type: integer
            format: int64
          description: "`not_found`일 때 없는 번호들"
        fileName:
          type: string
          description: "`file_too_large`일 때"
        bytes:
          type: integer
          minimum: 0
          description: "`file_too_large`일 때"
        fileExtension:
          type: string
          description: "`unsupported_format`일 때. 점 없이(`zip`)"
    SaveItemRequest:
      description: |
        링크는 `http`·`https`만(COM-001 값). 그 밖의 스킴은 클라이언트가 글로 보낸다.
        파일은 `POST /uploads`로 받은 `uploadId`로 보낸다.
      oneOf:
        - type: object
          required: [kind, url]
          properties:
            kind:
              type: string
              const: link
            url:
              type: string
              format: uri
        - type: object
          required: [kind, text]
          properties:
            kind:
              type: string
              const: text
            text:
              type: string
              minLength: 1
        - type: object
          required: [kind, uploadId]
          properties:
            kind:
              type: string
              const: file
            uploadId:
              type: string
              format: uuid
      discriminator:
        propertyName: kind
    SaveItemResult:
      type: object
      required: [result, item]
      properties:
        result:
          type: string
          enum: [saved, duplicate, inTrash]
          description: |
            saved = 새로 저장. duplicate = 같은 자료가 있어 그 자료를 돌려줌(COM-001 규칙 3).
            inTrash = 같은 자료가 휴지통에 있음(COM-001 규칙 7, ARC-008 규칙 8)
        item:
          $ref: "#/components/schemas/ItemSummary"
    ItemSummary:
      type: object
      description: 목록 한 줄에 필요한 값. 자료는 사용자별 번호로만 가리킨다(ARC-001)
      required: [number, kind, title, source, status, blockedReason, listSummary, summarySource, partialNote, tags, matchedIn, savedAt]
      properties:
        number:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
          enum: [link, text, file]
        title:
          type: string
          description: 링크는 페이지 제목(처리 전이면 주소), 글은 첫 줄 24자까지, 파일은 파일 이름
        source:
          type: [string, "null"]
          description: 링크는 호스트, 파일은 형식(`pdf` 등)
        status:
          $ref: "#/components/schemas/ItemStatus"
        blockedReason:
          type: [string, "null"]
          enum: [login_required, access_denied, disallowed_url, encrypted, no_text, null]
          description: "`blocked`일 때 이유(ARC-005, COM-004 규칙 6)"
        listSummary:
          type: [string, "null"]
          description: 흐린 한 줄 요약. 직접 고친 요약이 있으면 그것(ARC-004)
        summarySource:
          type: [string, "null"]
          enum: [ai, user, null]
          description: ARC-004 규칙 5
        partialNote:
          type: [string, "null"]
          description: 일부만 읽었을 때 요약 끝에 붙일 말(ARC-004 규칙 8)
        tags:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 20
          description: 자동 태그, `#` 없이(ARC-002 값 0~5개, 1~20자)
        matchedIn:
          type: [string, "null"]
          enum: [title, source, summary, body, imageText, tag, null]
          description: 찾기 결과에서 일치한 곳. 요약 줄 끝에 흐리게(`이미지 속 글자`, commands 6절 목록 꼬리표). 찾기가 아니면 null
        savedAt:
          type: string
          format: date-time
    ItemStatus:
      type: string
      enum: [received, processing, ready, blocked, failed]
      description: ARC-005 처리 상태. 이 다섯 가지뿐이다
    CreateUploadRequest:
      type: object
      required: [fileName, size]
      properties:
        fileName:
          type: string
          minLength: 1
        size:
          type: integer
          format: int64
          minimum: 0
          description: 바이트
    Upload:
      type: object
      required: [uploadId, uploadUrl, expiresAt]
      properties:
        uploadId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
          description: 파일을 PUT할 서명 URL(비공개 버킷 items)
        expiresAt:
          type: string
          format: date-time
    ItemPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
        nextCursor:
          type: [string, "null"]
          description: 다음 쪽이 없으면 null
    SearchPage:
      type: object
      required: [items, total, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
        total:
          type: integer
          minimum: 0
          description: 조건에 맞는 전체 건수
        nextCursor:
          type: [string, "null"]
    ItemLookup:
      type: object
      required: [items, missing]
      properties:
        items:
          type: array
          description: 요청한 순서대로, 있는 자료만
          items:
            $ref: "#/components/schemas/ItemSummary"
        missing:
          type: array
          description: 없거나 휴지통·영구 삭제한 자료의 번호(`✗ 없는 번호`, ARC-001 규칙 10)
          items:
            type: integer
            format: int64
    UploadLimits:
      type: object
      required: [formats, maxBytes]
      properties:
        formats:
          type: array
          description: COM-004 값 표의 받는 형식
          items:
            type: string
            enum: [pdf, md, txt, docx, png, jpeg, webp, heic]
        maxBytes:
          type: integer
          format: int64
          description: 20MB(COM-004 규칙 7·8)
    NumbersRequest:
      type: object
      required: [numbers]
      properties:
        numbers:
          type: array
          minItems: 1
          description: 자료 번호. 같은 번호가 두 번 오면 처음 것만 쓴다
          items:
            type: integer
            format: int64
            minimum: 1
    ItemRefList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [number, title]
            properties:
              number:
                type: integer
                format: int64
              title:
                type: string
    CountResult:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          minimum: 0
    TrashItem:
      type: object
      required: [item, trashedAt, daysLeft]
      properties:
        item:
          $ref: "#/components/schemas/ItemSummary"
        trashedAt:
          type: string
          format: date-time
        daysLeft:
          type: integer
          minimum: 0
          description: 영구 삭제까지 남은 날(`30일 남음`, ARC-008 규칙 10). 서버가 한국 시간 날짜로 계산한다
    TrashPage:
      type: object
      required: [items, total, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrashItem"
        total:
          type: integer
          minimum: 0
        nextCursor:
          type: [string, "null"]
    ReviseItemRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        removeTags:
          type: array
          minItems: 1
          description: 지울 태그, `#` 없이. 자료에 없는 태그는 무시한다
          items:
            type: string
    SampleResult:
      type: object
      required: [firstNumber, lastNumber]
      properties:
        firstNumber:
          type: integer
          format: int64
        lastNumber:
          type: integer
          format: int64
          description: 받은 범위. 완료 줄과 `버리기 <a>-<b>` 안내에 쓴다(ARC-010 규칙 4·6)
    EventRequest:
      type: object
      required: [name, numbers, method]
      properties:
        name:
          type: string
          const: handoff_copied
        numbers:
          type: array
          minItems: 1
          description: 넘긴 자료 번호. 서버가 건수와 저장 뒤 지난 일수를 계산하는 데만 쓰고 번호 자체는 남기지 않는다
          items:
            type: integer
            format: int64
            minimum: 1
        method:
          type: string
          enum: [pick, pipe]
          description: 방식. pick = 고른 자료, pipe = `찾기 … | 넘기기`
    HandoffRequest:
      type: object
      required: [numbers]
      properties:
        numbers:
          type: array
          minItems: 1
          description: 고른 순서. 같은 번호가 두 번 오면 서버가 처음 것만 쓴다(ARC-001 값)
          items:
            type: integer
            format: int64
            minimum: 1
    Handoff:
      type: object
      required: [text, charCount, items, missingSummaryCount]
      properties:
        text:
          type: string
          description: 클립보드에 넣을 글 전체(handoff-format)
        charCount:
          type: integer
          minimum: 0
          description: "`text`의 글자 수(유니코드 문자, 줄바꿈 포함). `✓ 복사됨  2건 · 442자`"
        items:
          type: array
          description: 넘긴 자료마다 `<번호>  <제목>` 한 줄
          items:
            type: object
            required: [number, title]
            properties:
              number:
                type: integer
                format: int64
              title:
                type: string
        missingSummaryCount:
          type: integer
          minimum: 0
          description: "`! 요약 없음 N건`"
