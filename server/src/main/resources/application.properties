spring.application.name=grep-server

# ADR-0011: 포트와 비밀값은 모두 환경변수로 받는다.
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

# 마이그레이션 원본은 저장소 루트 db/migrations(ADR-0010). build.gradle.kts가 classpath db/migration으로 복사한다.
spring.flyway.locations=classpath:db/migration
# 새 Supabase 프로젝트는 public 스키마에 함수(rls_auto_enable 등)를 미리 둬서 Flyway가 빈 스키마로 보지 않는다.
# 기록 표가 없을 때만 버전 0으로 기준선을 잡고 V1부터 적용한다. 빈 DB(테스트)에는 영향이 없다(AI 로그 081).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ADR-BCK-006 결정 5: Supabase 전용 SDK 없이 표준 JWKS로 검증한다.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_URL:http://localhost:54321}/auth/v1/.well-known/jwks.json
# jwk-set-uri와 함께 두면 탐색 요청 없이 iss 검증에만 쓴다. 값 형식: https://supabase.com/docs/guides/auth/jwt-fields
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_URL:http://localhost:54321}/auth/v1
spring.security.oauth2.resourceserver.jwt.audiences=authenticated
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
grep.web-origin=${WEB_ORIGIN:http://localhost:5173}

# 파일 원본(ADR-BCK-002 결정 2). Supabase Storage S3. 키가 비어 있어도 서버는 뜨고, 파일 저장을 처음 부를 때 연결한다.
grep.storage.s3.endpoint=${STORAGE_S3_ENDPOINT:http://localhost:54321/storage/v1/s3}
grep.storage.s3.region=${STORAGE_S3_REGION:}
grep.storage.s3.access-key-id=${STORAGE_S3_ACCESS_KEY_ID:}
grep.storage.s3.secret-access-key=${STORAGE_S3_SECRET_ACCESS_KEY:}
grep.storage.bucket=${STORAGE_BUCKET:items}
